<svg xmlns="http://www.w3.org/2000/svg" width="1936.000" height="400" viewBox="0 0 100 100" preserveAspectRatio="none" role="img" aria-labelledby="title desc"><title id="title">Blue Black Red Green</title><desc id="desc">Interpretive SVG study after Blue Black Red Green. Geometry approximate; standardized vivid screen colours. Four shapes normalized to an overall bounding box; orientations approximate.</desc><metadata>Reference: https://ellsworthkelly.org/work/blue-black-red-green/; reviewed 2026-10-26; not a facsimile.</metadata><polygon fill="#0647cb" data-colour="blue" points="0,50 4,15 8,50 4,85"/><polygon fill="#171817" data-colour="black" points="26,30 31,15 33,68 28,85"/><polygon fill="#ec231b" data-colour="red" points="52,44 58,0 62,50 56,100"/><polygon fill="#008647" data-colour="green" points="82,10 89,31 86,84 80,65"/></svg>