<svg xmlns="http://www.w3.org/2000/svg" width="666.667" height="400" viewBox="0 0 100 100" preserveAspectRatio="none" role="img" aria-labelledby="title desc"><title id="title">Color Panels for a Large Wall</title><desc id="desc">Interpretive SVG study. Approximate geometry; standardized vivid colours. All 18 positions follow the photograph. Frontal grid rectifies perspective; dark hues grouped and panel sizes/spacing schematic.</desc><metadata>Primary reference: https://ellsworthkelly.org/work/color-panels-for-a-large-wall/; reviewed 2026-10-26; not a facsimile.</metadata><rect data-colour="orange" fill="#fb7100" x="0" y="0" width="9" height="13"/><rect data-colour="blue" fill="#0647cb" x="17.5" y="0" width="9" height="13"/><rect data-colour="blue" fill="#0647cb" x="35" y="0" width="9" height="13"/><rect data-colour="yellow" fill="#ffe000" x="52.5" y="0" width="9" height="13"/><rect data-colour="orange" fill="#fb7100" x="70" y="0" width="9" height="13"/><rect data-colour="blue" fill="#0647cb" x="87.5" y="0" width="9" height="13"/><rect data-colour="blue" fill="#0647cb" x="0" y="40" width="9" height="13"/><rect data-colour="purple" fill="#7338a4" x="17.5" y="40" width="9" height="13"/><rect data-colour="green" fill="#008647" x="35" y="40" width="9" height="13"/><rect data-colour="purple" fill="#7338a4" x="52.5" y="40" width="9" height="13"/><rect data-colour="red" fill="#ec231b" x="70" y="40" width="9" height="13"/><rect data-colour="brown" fill="#8a3b22" x="87.5" y="40" width="9" height="13"/><rect data-colour="yellow" fill="#ffe000" x="0" y="80" width="9" height="13"/><rect data-colour="purple" fill="#7338a4" x="17.5" y="80" width="9" height="13"/><rect data-colour="red" fill="#ec231b" x="35" y="80" width="9" height="13"/><rect data-colour="purple" fill="#7338a4" x="52.5" y="80" width="9" height="13"/><rect data-colour="blue" fill="#0647cb" x="70" y="80" width="9" height="13"/><rect data-colour="red" fill="#ec231b" x="87.5" y="80" width="9" height="13"/></svg>
