<svg xmlns="http://www.w3.org/2000/svg" width="476.690212" height="400" viewBox="0 0 100 100" preserveAspectRatio="none" role="img" aria-labelledby="title desc"><title id="title">La Combe II</title><desc id="desc">Hand-authored interpretive SVG after direct visual inspection of the cited primary reference. Approximate contours and interpretive colors; not a facsimile. Complete Foundation color photograph explicitly labeled LaCombeII1951 shows black stair-shadow lines on white hinged screen. All nine panels retained; equal panel widths and planar arrangement are an interpretive unfolding of the photographed folds, so normalized only. This is distinct from the red-on-white flat LaCombeI canvas. Palette refinement (2026-11-09): source review remains unresolved for black, white; prior provisional screen colors retained, not calibrated to original paint.</desc><metadata>Primary reference: https://discoveringek.ellsworthkelly.org/ek-100-chapter-3; record moma1973-pdf40-caption2; visual review 2026-10-28. Pure-vector study.</metadata><rect data-colour="white" fill="#f3f1e8" x="0" y="0" width="100" height="100"/><rect data-colour="white" fill="#d5d5d0" x="11.0611" y="0" width="0.1" height="100"/><rect data-colour="white" fill="#d5d5d0" x="22.1722" y="0" width="0.1" height="100"/><rect data-colour="white" fill="#d5d5d0" x="33.2833" y="0" width="0.1" height="100"/><rect data-colour="white" fill="#d5d5d0" x="44.3944" y="0" width="0.1" height="100"/><rect data-colour="white" fill="#d5d5d0" x="55.5056" y="0" width="0.1" height="100"/><rect data-colour="white" fill="#d5d5d0" x="66.6167" y="0" width="0.1" height="100"/><rect data-colour="white" fill="#d5d5d0" x="77.7278" y="0" width="0.1" height="100"/><rect data-colour="white" fill="#d5d5d0" x="88.8389" y="0" width="0.1" height="100"/><polygon data-colour="black" fill="#20211f" points="0,5.425 6.5,5.425 6.5,4.575 0,4.575"/><polygon data-colour="black" fill="#20211f" points="6.8128,5.2877 11.413,0.28775 10.787,-0.28775 6.1872,4.71